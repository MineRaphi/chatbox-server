# Run with: docker compose up -d --build
services:
  chatbox-server:
    build:
      context: .
      # Build steps (npm ci) use the host's network. On some hosts, e.g.
      # Ubuntu with systemd-resolved and Tailscale, BuildKit's own build
      # network can't resolve registry.npmjs.org (npm fails with EAI_AGAIN)
      # even though normal containers can. Only affects building.
      network: host
    image: chatbox-server:2
    restart: unless-stopped
    ports:
      - '3847:3847'
    environment:
      PORT: 3847
      # Emotes per 10 seconds per connection; 0 turns the limit off.
      RATE_LIMIT: 30
    # Read-only filesystem: the server stores nothing.
    read_only: true
    security_opt:
      - no-new-privileges:true
